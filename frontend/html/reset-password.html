<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — AI Health Clinic</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--bg-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border-color); width: 100%; max-width: 440px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/static/html/index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; font-size: 1.4rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 0.5rem;">
        <div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div>
        <span>AI Health Clinic</span>
      </a>
      <h2 style="font-size: 1.35rem; color: var(--primary-navy); margin-top: 1rem;">Reset Password</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted);">Enter your email to update your account security credentials</p>
    </div>

    <form onsubmit="handleResetPassword(event)">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Registered Email</label>
        <input type="email" id="reset-email" required placeholder="patient@clinic.com" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">New Password (Min. 6 Characters)</label>
        <input type="password" id="reset-new-password" required minlength="6" placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none;">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem;">
        Update Password
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-muted);">
      Remember your password? <a href="/static/html/login.html" style="color: var(--medical-teal); font-weight: 600;">Sign In</a>
    </div>

  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    async function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById("reset-email").value.trim();
      const newPassword = document.getElementById("reset-new-password").value;

      try {
        await API.post("/api/auth/reset-password", {
          email,
          new_password: newPassword
        });
        API.toast("Password reset successfully! Redirecting to login...", "success");
        setTimeout(() => {
          window.location.href = "/static/html/login.html";
        }, 1200);
      } catch (err) {
        console.error("Reset failed", err);
      }
    }
  </script>
</body>
</html>
