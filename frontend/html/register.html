<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — AI Health Clinic</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--bg-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <div style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border-color); width: 100%; max-width: 480px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/static/html/index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; font-size: 1.4rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 0.5rem;">
        <div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div>
        <span>AI Health Clinic</span>
      </a>
      <h2 style="font-size: 1.35rem; color: var(--primary-navy); margin-top: 1rem;">Create Your Account</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted);">Manage health timeline, consult AI, and connect with doctors</p>
    </div>

    <form onsubmit="handleRegister(event)">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Full Legal Name</label>
        <input type="text" id="reg-name" required placeholder="e.g. Rohan Sharma" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Email Address</label>
        <input type="email" id="reg-email" required placeholder="name@example.com" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Phone Number</label>
        <input type="tel" id="reg-phone" placeholder="+91 98765 43210" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">I am joining as a</label>
        <select id="reg-role" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none; background: white;">
          <option value="patient" selected>Patient (Health Consultation & Medical Records)</option>
          <option value="doctor">Medical Practitioner / Doctor (Requires Verification)</option>
        </select>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Password (Min. 6 Characters)</label>
        <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
        By signing up, you agree to AI Health Clinic's <a href="/static/html/privacy.html" style="color: var(--medical-teal);">Privacy Policy</a> and <a href="/static/html/disclaimer.html" style="color: var(--medical-teal);">Medical Disclaimer</a>.
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 0.95rem;">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="/static/html/login.html" style="color: var(--medical-teal); font-weight: 600;">Sign In</a>
    </div>

  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
