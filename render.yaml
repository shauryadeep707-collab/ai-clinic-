services:
  - type: web
    name: ai-health-clinic
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_NAME
        value: "AI Health Clinic"
      - key: DB_ENGINE
        value: sqlite
      - key: PYTHONPATH
        value: .
      - key: SECRET_KEY
        generateValue: true
