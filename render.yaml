services:
  - type: web
    name: ai-health-clinic
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AI_MODE
        value: demo
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: EMERGENCY_NUMBER
        value: "112"
      - key: AMBULANCE_NUMBER
        value: "108"
